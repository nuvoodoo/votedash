<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoteDash usage</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --paper:#F6F4EE; --paper-2:#EDEAE1; --ink:#15181D; --ink-2:#3B4048; --rule:#D9D5CA; --dem:#2458B3; --amber:#D48A00; --surface:#fff; }
@media (prefers-color-scheme: dark) { :root { --paper:#121417; --paper-2:#1E2228; --ink:#F2F0EA; --ink-2:#C3C8CF; --rule:#2E333B; --surface:#181B20; --dem:#5B8AE6; --amber:#F0A52A; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
header { background: #15181D; color: #fff; padding: 12px 16px; display: flex; align-items: baseline; gap: 14px; }
header b { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 22px; }
header b span { color: #D48A00; }
header small { color: #D6D9DE; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.tile { background: var(--surface); border-top: 3px solid var(--ink); padding: 10px 12px; }
.tile .n { font-family: "IBM Plex Sans Condensed", sans-serif; font-weight: 600; font-size: 40px; line-height: 1; }
.tile .n.live { color: var(--amber); }
.tile .l { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
h2 { font-size: 15px; margin: 18px 0 6px; }
.chart { background: var(--surface); border: 1px solid var(--rule); padding: 8px; }
.chart svg { width: 100%; height: 220px; display: block; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 13.5px; }
td { padding: 6px 8px; border-bottom: 1px solid var(--rule); }
td.v { text-align: right; width: 70px; font-weight: 600; }
.legend { font-size: 12px; color: var(--ink-2); display: flex; gap: 14px; margin-top: 4px; }
.legend i { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 4px; }
.err { padding: 40px 16px; }
</style>
</head>
<body>
<header><b>Vote<span>Dash</span></b><small id="sub">usage</small></header>
<main id="main"><p class="err">Loading.</p></main>
<script>
(async function () {
  const key = new URLSearchParams(location.search).get('key') || '';
  const main = document.getElementById('main');
  const fmt = (n) => (n || 0).toLocaleString('en-US');
  const t = (ts) => new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  async function load() {
    const r = await fetch('/api/usage?key=' + encodeURIComponent(key), { cache: 'no-store' });
    if (!r.ok) { main.innerHTML = '<p class="err">Not available.</p>'; return; }
    const d = await r.json();
    document.getElementById('sub').textContent = 'usage since ' + new Date(d.since).toLocaleString('en-US') + ', refreshed ' + t(d.now);
    const tile = (n, l, cls) => `<div class="tile"><div class="n ${cls || ''}">${fmt(n)}</div><div class="l">${l}</div></div>`;
    const list = (title, rows) => `<div><h2>${title}</h2><table>${rows.map((x) => `<tr><td>${x.k}</td><td class="v">${fmt(x.v)}</td></tr>`).join('') || '<tr><td>None yet</td></tr>'}</table></div>`;
    // chart: viewers (concurrent peak), views, uniques per minute over 24h
    const s = d.series; const W = 1000, H = 220, P = 28;
    let svg = '';
    if (s.length > 1) {
      const x0 = s[0][0], x1 = s[s.length - 1][0];
      const mx = Math.max(1, ...s.map((p) => Math.max(p[1], p[2], p[3])));
      const X = (ts) => P + (ts - x0) / Math.max(1, x1 - x0) * (W - P * 2);
      const Y = (v) => H - P + 6 - v / mx * (H - P * 2);
      const line = (i, color) => `<polyline fill="none" stroke="${color}" stroke-width="2" points="${s.map((p) => `${X(p[0]).toFixed(1)},${Y(p[i]).toFixed(1)}`).join(' ')}"/>`;
      const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => `<text x="${P - 6}" y="${Y(mx * f).toFixed(1)}" text-anchor="end" font-size="11" fill="currentColor" opacity=".7">${Math.round(mx * f)}</text><line x1="${P}" x2="${W - P}" y1="${Y(mx * f).toFixed(1)}" y2="${Y(mx * f).toFixed(1)}" stroke="currentColor" opacity=".08"/>`).join('');
      const xt = [0, 0.5, 1].map((f) => { const ts = x0 + (x1 - x0) * f; return `<text x="${X(ts).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">${t(ts)}</text>`; }).join('');
      svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Usage over the last 24 hours">${ticks}${xt}${line(1, '#6E7681')}${line(2, '#2458B3')}${line(3, '#D48A00')}</svg>`;
    }
    main.innerHTML = `
      <div class="tiles">
        ${tile(d.concurrent, 'Watching right now (open connections)', 'live')}
        ${tile(d.active5m, 'Active in the last 5 minutes')}
        ${tile(d.peak24h, 'Peak concurrent, 24h')}
        ${tile(d.uniques.day, 'Unique visitors, 24h')}
        ${tile(d.uniques.hour, 'Unique visitors, last hour')}
        ${tile(d.views.day, 'Page loads, 24h')}
        ${tile(d.views.hour, 'Page loads, last hour')}
        ${tile(d.uniques.all, 'Unique visitors, all time')}
        ${tile(d.mobileShare + '%', 'On mobile')}
        ${tile(d.returning, 'Visitors with 5+ loads')}
      </div>
      <h2>Last 24 hours, per minute</h2>
      <div class="chart">${svg || '<p>Not enough data yet.</p>'}<div class="legend"><span><i style="background:#D48A00"></i>Concurrent viewers</span><span><i style="background:#2458B3"></i>Unique visitors</span><span><i style="background:#6E7681"></i>Page loads</span></div></div>
      <div class="grid">
        ${list('Most opened races', d.races)}
        ${list('Views by section', d.pages)}
        ${list('Referrers', d.referrers)}
        ${list('Countries', d.countries)}
      </div>`;
  }
  await load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
